name: pin-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check commit-pinned raw URLs
        run: python3 tools/pin-check/check_pins.py
