name: Check pinned image URLs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pinned-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check pinned image URLs
        run: python3 scripts/check_pinned_images.py
